[package]
name = "desktop-pet"
version = "0.1.0"
edition = "2021"
description = "A cute transparent desktop pet - tiny pixel cat living on your desktop. Offline, private, lightweight."
authors = ["Desktop Pet"]
license = "MIT"
repository = "https://github.com/example/desktop-pet"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
dirs = "5"
tokio = { version = "1.53.1", features = ["time"] }
rand = "0.9.5"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
