[package]
name = "desktop-pet"
version = "0.2.0"
edition = "2021"
description = "A cute transparent desktop pet - tiny pixel cat living on your desktop. Offline, private, lightweight."
authors = ["Desktop Pet"]
license = "MIT"
repository = "https://github.com/example/desktop-pet"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2.2"
dirs = "5"
tokio = { version = "1", features = ["time"] }
rand = "0.9"
